<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArKeyboard</title>
    <!-- Font Amiri dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi Gradient Background */
        body {
            background: linear-gradient(-45deg, #0f172a, #312e81, #4c1d95, #1e1b4b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            touch-action: manipulation; /* Mencegah zoom saat double tap di mobile */
            -webkit-tap-highlight-color: transparent;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-key {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-key:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .glass-key:active {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(2px) scale(0.95);
        }

        .glass-tab {
            transition: all 0.3s ease;
        }

        .glass-tab.active {
            background: rgba(167, 139, 250, 0.3);
            border-color: rgba(167, 139, 250, 0.5);
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.2);
        }

        /* Sembunyikan scrollbar untuk tab agar rapi tapi tetap bisa digeser */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Font Arab Custom */
        .font-arab {
            font-family: 'Amiri', serif;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center py-6 px-3 sm:px-6">

    <!-- Header -->
    <header class="w-full max-w-3xl mb-6 flex justify-between items-center px-2">
        <h1 class="text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-300 to-indigo-300">ArKeyboard</h1>
        <div class="flex gap-2">
            <!-- Copy & Clear Buttons -->
            <button id="btnCopy" class="glass-key rounded-full p-3 text-purple-200" title="Salin Teks">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <button id="btnClear" class="glass-key rounded-full p-3 text-red-300" title="Hapus Semua">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
        </div>
    </header>

    <!-- Text Area -->
    <div class="w-full max-w-3xl mb-6">
        <div class="glass-panel rounded-2xl p-4">
            <!-- inputmode="none" mencegah keyboard bawaan HP muncul -->
            <textarea id="output" inputmode="none" dir="rtl" class="w-full bg-transparent border-none outline-none resize-none font-arab text-4xl leading-relaxed text-right h-40 placeholder-white/30" placeholder="ابدأ الكتابة هنا..."></textarea>
        </div>
    </div>

    <!-- Main Keyboard Container -->
    <div class="w-full max-w-3xl glass-panel rounded-3xl p-3 sm:p-5 flex flex-col gap-4 relative">
        
        <!-- Tab Navigation (Bisa discroll secara horizontal) -->
        <div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2 px-1 snap-x">
            <button data-tab="arab" class="tab-btn glass-tab active glass-key rounded-xl px-6 py-2.5 font-semibold text-sm whitespace-nowrap snap-start tracking-wide">Huruf Arab</button>
            <button data-tab="harakat" class="tab-btn glass-tab glass-key rounded-xl px-6 py-2.5 font-semibold text-sm whitespace-nowrap snap-start tracking-wide">Harakat & Tanwin</button>
            <button data-tab="waqaf" class="tab-btn glass-tab glass-key rounded-xl px-6 py-2.5 font-semibold text-sm whitespace-nowrap snap-start tracking-wide">Tanda Waqaf</button>
        </div>

        <!-- Keyboard Area -->
        <div id="keyboardArea" class="w-full flex flex-col gap-2 sm:gap-3">
            <!-- Layouts will be injected via JS -->
        </div>

        <!-- Control Keys (Space & Backspace) -->
        <div class="flex justify-center gap-2 sm:gap-3 mt-2">
            <!-- Backspace -->
            <button id="btnBackspace" class="glass-key rounded-xl w-1/4 sm:w-24 h-14 flex items-center justify-center text-purple-200">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
            </button>
            <!-- Spacebar -->
            <button id="btnSpace" class="glass-key rounded-xl flex-1 h-14 flex items-center justify-center text-white/50">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
            </button>
            <!-- Enter -->
            <button id="btnEnter" class="glass-key rounded-xl w-1/4 sm:w-24 h-14 flex items-center justify-center text-purple-200">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10L4 15L9 20"></path><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg>
            </button>
        </div>

    </div>

    <!-- Notification Toast (Untuk alert "Disalin") -->
    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-white/20 backdrop-blur-xl text-white px-6 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300">
        Teks berhasil disalin!
    </div>

    <script>
        const output = document.getElementById('output');
        const keyboardArea = document.getElementById('keyboardArea');
        const tabBtns = document.querySelectorAll('.tab-btn');
        
        // Data Keyboard
        const layouts = {
            arab: [
                ['ض', 'ص', 'ث', 'ق', 'ف', 'غ', 'ع', 'ه', 'خ', 'ح', 'ج', 'د'],
                ['ش', 'س', 'ي', 'ب', 'ل', 'ا', 'ت', 'ن', 'م', 'ك', 'ط'],
                ['ئ', 'ء', 'ؤ', 'ر', 'لا', 'ى', 'ة', 'و', 'ز', 'ظ']
            ],
            // Untuk harakat, nilai value adalah unicode, sedangkan label menggunakan tatweel (ـ) sebagai dasar
            harakat: [
                [{label: 'ـَ', value: '\u064E', name: 'Fatha'}, {label: 'ـِ', value: '\u0650', name: 'Kasra'}, {label: 'ـُ', value: '\u064F', name: 'Damma'}],
                [{label: 'ـً', value: '\u064B', name: 'Fathatan'}, {label: 'ـٍ', value: '\u064D', name: 'Kasratan'}, {label: 'ـٌ', value: '\u064C', name: 'Dammatan'}],
                [{label: 'ـْ', value: '\u0652', name: 'Sukun'}, {label: 'ـّ', value: '\u0651', name: 'Shadda'}, {label: 'ـٓ', value: '\u0653', name: 'Maddah'}, {label: 'ـٰ', value: '\u0670', name: 'Alif Khaniariyah'}]
            ],
            waqaf: [
                [{label: 'ـۖ', value: '\u06D6', name: 'Al-Wasl Awla'}, {label: 'ـۗ', value: '\u06D7', name: 'Al-Waqf Awla'}, {label: 'ـۘ', value: '\u06D8', name: 'Lazim'}],
                [{label: 'ـۙ', value: '\u06D9', name: 'La Waqaf'}, {label: 'ـۚ', value: '\u06DA', name: 'Jaiz'}, {label: 'ـۛ', value: '\u06DB', name: 'Mua\'naqah'}],
                [{label: '۝', value: '۝', name: 'Akhir Ayat'}, {label: '۞', value: '۞', name: 'Hizb'}, {label: '۩', value: '۩', name: 'Sajdah'}, {label: '﷽', value: '﷽', name: 'Basmalah'}]
            ]
        };

        let currentTab = 'arab';

        // Fungsi Render Keyboard
        function renderKeyboard() {
            keyboardArea.innerHTML = '';
            const rows = layouts[currentTab];
            
            rows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'flex justify-center gap-1 sm:gap-2';
                
                row.forEach(key => {
                    const btn = document.createElement('button');
                    // Styling
                    btn.className = 'glass-key rounded-xl flex-1 max-w-[50px] sm:max-w-[65px] h-12 sm:h-14 flex items-center justify-center text-xl sm:text-3xl font-arab text-white user-select-none';
                    
                    let label = '';
                    let val = '';

                    if (typeof key === 'object') {
                        label = key.label;
                        val = key.value;
                    } else {
                        label = key;
                        val = key;
                    }

                    btn.innerHTML = label;
                    
                    // Mencegah blur pada textarea saat tombol ditekan
                    btn.addEventListener('mousedown', (e) => {
                        e.preventDefault(); 
                    });

                    // Input Teks
                    btn.addEventListener('click', () => {
                        insertText(val);
                    });
                    
                    rowDiv.appendChild(btn);
                });
                
                keyboardArea.appendChild(rowDiv);
            });
        }

        // Fungsi Memasukkan Teks Tepat di Posisi Kursor
        function insertText(text) {
            const start = output.selectionStart;
            const end = output.selectionEnd;
            const value = output.value;
            
            output.value = value.substring(0, start) + text + value.substring(end);
            output.selectionStart = output.selectionEnd = start + text.length;
            output.focus();
        }

        // Handle Tombol Control
        document.getElementById('btnSpace').addEventListener('mousedown', e => e.preventDefault());
        document.getElementById('btnSpace').addEventListener('click', () => insertText(' '));

        document.getElementById('btnEnter').addEventListener('mousedown', e => e.preventDefault());
        document.getElementById('btnEnter').addEventListener('click', () => insertText('\n'));

        document.getElementById('btnBackspace').addEventListener('mousedown', e => e.preventDefault());
        document.getElementById('btnBackspace').addEventListener('click', () => {
            const start = output.selectionStart;
            const end = output.selectionEnd;
            const value = output.value;
            
            if (start === end && start > 0) {
                // Menghapus 1 karakter sebelum kursor
                output.value = value.substring(0, start - 1) + value.substring(end);
                output.selectionStart = output.selectionEnd = start - 1;
            } else if (start !== end) {
                // Menghapus seleksi teks
                output.value = value.substring(0, start) + value.substring(end);
                output.selectionStart = output.selectionEnd = start;
            }
            output.focus();
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            if(confirm('Hapus semua tulisan?')) {
                output.value = '';
                output.focus();
            }
        });

        document.getElementById('btnCopy').addEventListener('click', () => {
            if (!output.value) return;
            // Gunakan API modern clipboard
            navigator.clipboard.writeText(output.value).then(() => {
                showToast();
            }).catch(err => {
                // Fallback untuk browser lama
                output.select();
                document.execCommand('copy');
                showToast();
            });
            output.focus();
        });

        // Tab Switching Logic
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update styling tabs
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Ubah layout
                currentTab = btn.getAttribute('data-tab');
                
                // Animasi halus pergantian tab
                keyboardArea.style.opacity = 0;
                setTimeout(() => {
                    renderKeyboard();
                    keyboardArea.style.opacity = 1;
                }, 150);
            });
        });

        // Toast Notification System
        function showToast() {
            const toast = document.getElementById('toast');
            toast.style.opacity = 1;
            setTimeout(() => {
                toast.style.opacity = 0;
            }, 2000);
        }

        // Inisialisasi awal
        keyboardArea.style.transition = 'opacity 0.15s ease';
        renderKeyboard();
        
        // Agar kursor fokus di awal secara otomatis
        window.addEventListener('DOMContentLoaded', () => {
            output.focus();
        });

    </script>
</body>
</html>
